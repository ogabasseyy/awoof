# Semgrep CI workflow using native Docker container (recommended approach)
# The returntocorp/semgrep-action is deprecated - using semgrep/semgrep container instead
# See https://semgrep.dev/docs/semgrep-ci/sample-ci-configs

name: Semgrep

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: # Allow manual triggers
  schedule:
    - cron: '45 2 * * 2' # Weekly on Tuesday at 2:45 UTC

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for private repository by github/codeql-action/upload-sarif
    name: Scan
    runs-on: ubuntu-latest
    # No job-level `if`: skipped jobs report Success, so skipping would let
    # PRs merge with a green check that never scanned anything. The scan
    # always runs (same-repo branches and forks alike); only the SARIF
    # upload below is skipped for forks, which lack security-events permission.
    container:
      # Pin to specific version for reproducible builds
      image: semgrep/semgrep:1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep scan
        # SEMGREP_APP_TOKEN is optional - enables Semgrep Cloud features if configured
        # To enable: add SEMGREP_APP_TOKEN secret from https://semgrep.dev
        run: |
          if [ -n "$SEMGREP_APP_TOKEN" ]; then
            semgrep ci --no-suppress-errors --sarif --output=semgrep.sarif
          else
            semgrep scan --config=p/ci --error --sarif --output=semgrep.sarif .
          fi
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN || '' }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: semgrep.sarif
        # Fork PRs lack security-events permission, so the upload (only the
        # upload — the scan above still runs) is skipped for them.
        if: always() && hashFiles('semgrep.sarif') != '' && github.event.pull_request.head.repo.fork != true
