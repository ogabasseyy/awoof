name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/backend/package-lock.json
            apps/widget/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts || npm install

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci || npm install

      - name: Install widget dependencies
        working-directory: apps/widget
        run: npm ci

      - name: Lint web
        working-directory: apps/web
        run: npm run lint

      - name: Type check web
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Type check backend
        working-directory: apps/backend
        run: npx tsc --noEmit

      - name: Lint backend
        working-directory: apps/backend
        run: npm run lint

      - name: Test backend
        working-directory: apps/backend
        run: npm test

      - name: Build widget
        working-directory: apps/widget
        run: npm run build

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci || npm install

      - name: Build
        working-directory: apps/backend
        run: npm run build
