name: Link Checker

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  link-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            cache-lychee-${{ runner.os }}-
            cache-lychee-

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Excludes below cover URLs lychee can never verify: synthetic test
          # origins/paths, auth-required APIs (401/400 by design), bot-blocked
          # doc hosts (403), and the pre-launch widget CDN (404 until the
          # "CDN deploy" todo ships — then drop the widget.awoof.com line).
          # Test-fixture OIDC issuers are never real tenants; the Google
          # token endpoint is POST-only (GET 404s by design); reserved
          # .example template hosts parse as bare domains; in-branch public
          # routes 404 on production until deployed. Keep every line inside
          # args a flag: this folded scalar has no comment syntax.
          # NDPC's official site rejects the CI crawler with HTTP 403; retain
          # its authoritative legal references for human review.
          args: >-
            --verbose
            --no-progress
            './**/*.md' './**/*.html' './**/*.tsx' './**/*.ts'
            --include-mail=false
            --exclude-path 'node_modules'
            --exclude 'localhost|127\.0\.0\.1'
            --exclude 'github\.com'
            --exclude 'via\.placeholder\.com|example\.com|yourcdn\.com|yoursite\.com'
            --exclude '\$\{|%7B|%7D'
            --exclude 'gsap\.com'
            --exclude 'greensock\.com'
            --exclude 'react\.dev'
            --exclude 'facebook\.com'
            --exclude 'alice\.github\.io|bob\.github\.io'
            --exclude 'graph\.microsoft\.com'
            --exclude 'login\.microsoftonline\.com/(authorize|never-store|other)'
            --exclude 'api\.paystack\.co|checkout\.paystack\.com|paystack\.com'
            --exclude 'npmjs\.com'
            --exclude 'widget\.awoof\.com'
            --exclude 'id\.me'
            --exclude 'jumia\.com\.ng'
            --exclude 'studentbeans\.com'
            --exclude '^https://ndpc\.gov\.ng/'
            --exclude 'login\.microsoftonline\.com/(common|tenant|tenant-[a-z]|11111111-1111-4111-8111-111111111111)/'
            --exclude 'oauth2\.googleapis\.com/token'
            --exclude 'https://(pending|refund|second-shop[^/]*)/'
            --exclude 'awoof\.tech/(trust|images/trust-og\.png)'
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
