name: Link Checker

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  link-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Restore lychee cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            cache-lychee-${{ runner.os }}-
            cache-lychee-

      - name: Link Checker
        uses: lycheeverse/lychee-action@7cd0af4c74a61395d455af97419279d86aafaede # v2.0.2
        with:
          # Excludes below cover URLs lychee can never verify: synthetic test
          # origins/paths, auth-required APIs (401/400 by design), bot-blocked
          # doc hosts (403), and the pre-launch widget CDN (404 until the
          # "CDN deploy" todo ships — then drop the widget.awoof.com line).
          args: >-
            --verbose
            --no-progress
            './**/*.md' './**/*.html' './**/*.tsx' './**/*.ts'
            --exclude-mail
            --exclude 'localhost|127\.0\.0\.1'
            --exclude 'github\.com'
            --exclude 'via\.placeholder\.com|example\.com|yourcdn\.com|yoursite\.com'
            --exclude '\$\{|%7B|%7D'
            --exclude 'gsap\.com'
            --exclude 'greensock\.com'
            --exclude 'react\.dev'
            --exclude 'facebook\.com'
            --exclude 'alice\.github\.io|bob\.github\.io'
            --exclude 'graph\.microsoft\.com'
            --exclude 'login\.microsoftonline\.com/(authorize|never-store|other)'
            --exclude 'api\.paystack\.co|checkout\.paystack\.com|paystack\.com'
            --exclude 'npmjs\.com'
            --exclude 'widget\.awoof\.com'
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
