# Docker Compose for Hostinger VPS deployment
# Run from repository root: docker compose -f docker-compose.hostinger.yml up -d

services:
  web:
    container_name: awoof-frontend
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL to the public HTTPS API URL}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      # Set to your public API URL (e.g. https://api.yourdomain.com or http://YOUR_VPS_IP:5001)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL to the public HTTPS API URL}
    restart: unless-stopped

  backend:
    container_name: awoof-backend
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.prod
    # Do not override user: image runs as nodejs (uid 1001) which owns uploads/vendors for product images
    working_dir: /usr/src/app
    # Persist vendor/product uploads (logos, documents, product images). Without this volume,
    # uploads are lost when the container is recreated. Entrypoint ensures dir is writable by app.
    volumes:
      - backend_uploads:/usr/src/app/uploads
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-awoofDB}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN to the public HTTPS web origin}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL to the public HTTPS web origin}
    ports:
      - "127.0.0.1:5001:5000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.prod
    working_dir: /usr/src/app
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-awoofDB}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/database/migrations/run.js"]
    restart: "no"

  db:
    container_name: awoof-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-awoofDB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-root} -d $${POSTGRES_DB:-awoofDB} || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: awoof-redis
    image: redis:7-alpine
    restart: always
    # Do NOT publish Redis to the host. Docker bypasses UFW; exposing 0.0.0.0:6380 allowed
    # internet access with no auth and led to crypto-miner compromise. Backend connects via
    # internal network (redis:6379). For CLI debugging from host, use: docker exec -it awoof-redis redis-cli -a $REDIS_PASSWORD
    env_file:
      - .env
    volumes:
      - redis_data:/data
    command:
      [
        "sh",
        "-c",
        'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    healthcheck:
      test: ["CMD", "sh", "-c", 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  db_data:
  redis_data:
  backend_uploads:
